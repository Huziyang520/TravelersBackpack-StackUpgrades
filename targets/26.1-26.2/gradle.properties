# This target belongs to the 26.x line. The sources live in the repository root (common/,
# fabric/) and are shared by every target; only this file and targets/<target>/libs differ
# per Minecraft version.

# Project
version=1.2.3.2612
group=com.tbsu
java_version=25

# Common
# This target covers 26.1 / 26.1.1 / 26.1.2 / 26.2, compiled against the lower bound 26.1.2.
minecraft_version=26.1.2
# Slug of the supported Minecraft range, used only for the artifact file name.
minecraft_version_slug=26.1-26.2
mod_name=Traveler's Backpack: Stack Upgrades
mod_author=Poluo_0, Huziyang520
mod_id=tbstackupgrades
license=LGPL-3.0-or-later OR MIT
description=[EN] Addon for Traveler's Backpack that provides stack upgrades.\n[CN] 旅行者背包附属：为旅行者背包提供堆叠升级。
minecraft_version_range=[26.1,26.3)
minecraft_version_range_fabric=>=26.1 <26.3
neoforge_version_range=[26.1,26.3)

# Fabric
fabric_version=0.155.3+26.1.2
fabric_loader_version=0.19.5

# NeoForge version of the neoforge module.
neoforge_version=26.1.2.94

# Required at runtime, provided by the player; compile time only here.
travelersbackpack_version=11.2.10
travelersbackpack_jar=travelersbackpack-fabric-26.1.2-11.2.10.jar
travelersbackpack_neo_jar=travelersbackpack-neoforge-26.1.2-11.2.10.jar
# Per target source overlay, relative to targets/<target>/. Empty = no overlay.
target_overlay=overlay

# Optional (Fabric only): config screen + TOML. Compile time only, never bundled or required.
forgeconfigapiport_jar=ForgeConfigAPIPort-v26.1.5-mc26.1.x-Fabric.jar

# Gradle
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
org.gradle.daemon=false
