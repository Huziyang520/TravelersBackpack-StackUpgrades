# This target belongs to the 26.x line. The sources live in the repository root (common/,
# fabric/) and are shared by every target; only this file and targets/<target>/libs differ
# per Minecraft version.

# Project
version=1.0.0
group=com.tbsu
java_version=25

# Common
minecraft_version=26.3
# Slug of the supported Minecraft range, used only for the artifact file name.
minecraft_version_slug=26.3
mod_name=Traveler's Backpack: Stack Upgrades
mod_author=Huziyang520
mod_id=tbstackupgrades
license=LGPL-3.0-or-later OR MIT
description=[EN] Addon for Traveler's Backpack adding five stack upgrades (x1.5 / x2 / x4 / x8 / x16) that raise how many items fit in a backpack slot. [CN] 旅行者背包附属：五个堆叠升级（×1.5 / ×2 / ×4 / ×8 / ×16），提升背包单格可容纳的物品数量。 Issues: https://github.com/Huziyang520/TravelersBackpack-StackUpgrades/issues
minecraft_version_range=[26.3,26.4)
minecraft_version_range_fabric=>=26.3 <26.4

# Fabric
fabric_version=0.165.2+26.3
fabric_loader_version=0.19.5

# NeoForge compile base of the common module (no NeoForge jar is produced by this target).
neoforge_version=26.3.0.1-beta

# Required at runtime, provided by the player; compile time only here.
travelersbackpack_version=11.4.3
travelersbackpack_jar=travelersbackpack-fabric-26.3-11.4.3.jar

# Gradle
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
org.gradle.daemon=false
