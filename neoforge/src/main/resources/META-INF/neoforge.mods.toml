modLoader="javafml"
loaderVersion="[4,)"
license="${license}"

[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
authors="${mod_author}"
displayURL="https://www.curseforge.com/minecraft/mc-mods/travelers-backpack-stack-upgrades"
issueTrackerURL="https://github.com/Huziyang520/TravelersBackpack-StackUpgrades/issues"
iconFile="assets/tbstackupgrades/icon.png"
description='''${description}'''

[[mixins]]
config="tbstackupgrades.mixins.json"

[[mixins]]
config="tbstackupgrades.neoforge.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neoforge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="travelersbackpack"
type="required"
versionRange="[${travelersbackpack_version},)"
ordering="NONE"
side="BOTH"
